<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UX Prototypes</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6f7f9;
      color: #1f2933;
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .intro { margin: 0 0 32px; color: #52606d; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      display: block;
      padding: 20px;
      background: #fff;
      border: 1px solid #e4e7eb;
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .card:hover, .card:focus-visible {
      border-color: #007960;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      outline: none;
    }
    .card h2 { margin: 0 0 6px; font-size: 17px; }
    .card p { margin: 0 0 12px; font-size: 14px; color: #52606d; }
    .meta { font-size: 12px; color: #7b8794; }
    footer { margin-top: 40px; font-size: 12px; color: #7b8794; }
  </style>
</head>
<body>
  <main>
    <h1>UX Prototypes</h1>
    <p class="intro">Interactive prototypes for review. Select one to open it.</p>

    <div class="grid">
      <!-- Copy one <a> block per prototype. href must match the folder name. -->
      <a class="card" href="advanced-search-prototype/">
        <h2>Advanced Search Prototype v1</h2>
        <p>v1.0 of an advanced search prototype</p>
        <span class="meta">Updated Nov 2026</span>
      </a>

    </div>

    <footer>Prototypes are for feedback only and do not represent final product.</footer>
  </main>
</body>
</html>
